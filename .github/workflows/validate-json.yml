name: Validate JSON and Issue/PR Title

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'public/community/level-based-words-a1-p-2.json'

# Permissions needed to read issue data via GitHub API
permissions:
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Linked Issue or PR Title with Regex
        run: |
          # 1. Try to extract the linked issue number from the PR body (e.g., "Closes #38")
          ISSUE_NUM=$(echo "${{ github.event.pull_request.body }}" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]*#?[[:space:]]*([0-9]+)' | grep -oE '[0-9]+' | tail -n 1)
          
          if [ -n "$ISSUE_NUM" ]; then
            # Fetch the actual Issue title using GitHub CLI
            TITLE_TO_CHECK=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUM --jq '.title')
            echo "🔍 Checking linked Issue #$ISSUE_NUM title: '$TITLE_TO_CHECK'"
          else
            # Fallback to PR title if no issue is explicitly linked in the body
            TITLE_TO_CHECK="${{ github.event.pull_request.title }}"
            echo "🔍 No linked issue found. Checking PR title instead: '$TITLE_TO_CHECK'"
          fi

          # 2. Regex check: Allows optional spaces inside the brackets
          # Matches: "[Good First Issue]", "[ Good First Issue ]", "[  Good   First  Issue ]"
          if [[ ! "$TITLE_TO_CHECK" =~ \[[:space:]]*Good[[:space:]]+First[[:space:]]+Issue[[:space:]]*\] ]]; then
            echo "❌ Error: Title must contain '[Good First Issue]' (spaces inside brackets are allowed)."
            echo "Current title checked: '$TITLE_TO_CHECK'"
            exit 1
          fi
          
          echo "✅ Title validation passed!"

      - name: Validate JSON and Check for Trailing Commas
        run: |
          python3 << 'EOF'
          import json
          import sys
          import re
          import os

          file_path = os.environ.get('FILE_PATH')

          try:
              with open(file_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Check for trailing comma: a comma followed by optional whitespace and then ] or }
              if re.search(r',\s*[\]\}]', content):
                  print("❌ Error: Trailing